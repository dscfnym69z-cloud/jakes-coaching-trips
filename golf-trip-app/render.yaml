services:
  - type: web
    name: golf-trip-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: golf-trip-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /opt/render/project/src/data
